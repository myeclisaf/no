[flake8]
max-line-length = 79
max-complexity = 10
ignore =
    W503,
    F811,
    D100, D107,
    D203, D205, D213,
    D400, D401,
    N806, N818
exclude =
    tests/
    venv/
    env/

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pygame==2.5.2
    pytest==7.1.3
    pytest-timeout==2.1.0